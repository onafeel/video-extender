<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>動画切り抜きアプリ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #005bb5;
    --border: #d2d2d7;
    --danger: #e02020;
    --warn: #b36b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f5f5f7;
      --muted: #9a9a9e;
      --border: #48484a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  .app-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .app-nav a {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .app-nav a.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }

  .picker {
    border: 2px dashed var(--border);
    border-radius: 0;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s;
  }
  .picker:hover { border-color: var(--accent); }
  .picker input { display: none; }
  .picker p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .picker .icon { font-size: 32px; }

  .preview-wrap { display: none; margin-top: 16px; }
  .preview-wrap.active { display: block; }
  .preview-wrap video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
    display: block;
    margin: 0 auto;
  }

  .frame-box { margin-top: 12px; }
  .frame-box video {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    border-radius: 10px;
    background: #000;
    display: block;
  }
  .frame-box span {
    display: block;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .single-range {
    margin-top: 14px;
  }
  .single-range input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .range-labels .seg { font-weight: 600; color: var(--text); }

  .target-picker {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .target-picker label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: block;
    margin-bottom: 8px;
  }
  .target-input {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .target-input input {
    width: 90px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    text-align: right;
  }

  .crop-option {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .crop-option input { accent-color: var(--accent); }

  button.primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }
  button.primary:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  button.primary:not(:disabled):hover { background: var(--accent-hover); }

  .progress-wrap { margin-top: 16px; display: none; }
  .progress-wrap.active { display: block; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar {
    height: 8px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .2s;
  }

  .result { display: none; margin-top: 16px; }
  .result.active { display: block; }
  .result video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
    display: block;
    margin: 0 auto;
  }
  .result a.download {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }

  .status-line {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 18px;
  }
  .status-line.error { color: var(--danger); }

  details.log { margin-top: 10px; }
  details.log summary {
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  details.log pre {
    font-size: 11px;
    background: #00000010;
    padding: 8px;
    border-radius: 8px;
    max-height: 160px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-nav">
    <a href="index.html">引き伸ばし</a>
    <a href="trim.html" class="active">切り抜き</a>
  </div>
  <h1>動画切り抜きアプリ</h1>
  <p class="sub">動画の始点を指定し、そこから指定した秒数だけ切り抜きます。すべての処理はブラウザ内で完結し、動画はどこにも送信されません。</p>

  <div class="card">
    <label class="picker" id="picker">
      <div class="icon">🎬</div>
      <div>動画を選択</div>
      <p>タップしてカメラロールやファイルから選択</p>
      <input type="file" id="fileInput" accept="video/*" />
    </label>

    <div class="preview-wrap" id="previewWrap">
      <video id="previewVideo" muted playsinline></video>

      <div class="frame-box">
        <video id="startFrameVideo" muted playsinline></video>
        <span id="startFrameLabel">始点: 0.0秒</span>
      </div>

      <div class="single-range">
        <input type="range" id="startRange" min="0" max="0" step="0.1" value="0" />
      </div>

      <div class="target-picker">
        <label for="durationInput">切り抜く長さ</label>
        <div class="target-input">
          <input type="number" id="durationInput" value="10" min="0.1" step="0.1" />
          <span>秒</span>
        </div>
      </div>

      <label class="crop-option">
        <input type="checkbox" id="crop916Toggle" />
        <span>9:16に切り抜く（中央基準で左右をカット、余白なし）</span>
      </label>

      <button class="primary" id="cutBtn">切り抜く</button>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span id="progressLabel">準備中…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="bar"><div id="progressBar"></div></div>
    </div>

    <div class="status-line" id="statusLine"></div>
    <details class="log" id="logDetails">
      <summary>詳細ログ</summary>
      <pre id="logPre"></pre>
    </details>

    <div class="result" id="result">
      <video id="resultVideo" controls playsinline></video>
      <a class="download" id="downloadLink" download="trimmed.mp4">動画を保存</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script type="module">
const { FFmpeg } = window.FFmpegWASM;
import { fetchFile, toBlobURL } from "https://esm.sh/@ffmpeg/util@0.12.1";

const fileInput = document.getElementById("fileInput");
const previewWrap = document.getElementById("previewWrap");
const previewVideo = document.getElementById("previewVideo");
const startFrameVideo = document.getElementById("startFrameVideo");
const startFrameLabel = document.getElementById("startFrameLabel");
const startRange = document.getElementById("startRange");
const durationInput = document.getElementById("durationInput");
const crop916Toggle = document.getElementById("crop916Toggle");
const cutBtn = document.getElementById("cutBtn");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressPct = document.getElementById("progressPct");
const progressLabel = document.getElementById("progressLabel");
const statusLine = document.getElementById("statusLine");
const logPre = document.getElementById("logPre");
const resultEl = document.getElementById("result");
const resultVideo = document.getElementById("resultVideo");
const downloadLink = document.getElementById("downloadLink");

let sourceFile = null;
let sourceDuration = 0;
let sourceWidth = 0;
let sourceHeight = 0;
let ffmpeg = null;
let ffmpegLoaded = false;

function setStatus(msg, isError = false) {
  statusLine.textContent = msg;
  statusLine.classList.toggle("error", isError);
}
function appendLog(line) {
  logPre.textContent += line + "\n";
  logPre.scrollTop = logPre.scrollHeight;
}

startRange.addEventListener("input", () => {
  const t = Number(startRange.value);
  previewVideo.currentTime = t;
  startFrameVideo.currentTime = t;
  startFrameLabel.textContent = `始点: ${t.toFixed(1)}秒`;
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  sourceFile = file;
  const url = URL.createObjectURL(file);
  previewVideo.src = url;
  startFrameVideo.src = url;
  previewVideo.addEventListener(
    "loadedmetadata",
    () => {
      sourceDuration = previewVideo.duration;
      sourceWidth = previewVideo.videoWidth;
      sourceHeight = previewVideo.videoHeight;
      startRange.max = sourceDuration;
      startRange.value = 0;
      startFrameVideo.currentTime = 0;
      startFrameLabel.textContent = "始点: 0.0秒";
      previewWrap.classList.add("active");
    },
    { once: true }
  );
});

async function ensureFFmpeg() {
  if (ffmpegLoaded) return;
  ffmpeg = new FFmpeg();
  ffmpeg.on("log", ({ message }) => appendLog(message));
  ffmpeg.on("progress", ({ progress }) => {
    const pct = Math.min(100, Math.max(0, Math.round(progress * 100)));
    progressBar.style.width = pct + "%";
    progressPct.textContent = pct + "%";
  });
  progressLabel.textContent = "エンジンを読み込み中…（初回のみ数十秒かかります）";
  progressWrap.classList.add("active");
  const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
  const workerChunkURL = "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js";
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
    classWorkerURL: await toBlobURL(workerChunkURL, "text/javascript"),
  });
  ffmpegLoaded = true;
}

cutBtn.addEventListener("click", async () => {
  const start = Number(startRange.value);
  const dur = Number(durationInput.value);

  if (!(dur > 0)) {
    setStatus("切り抜く長さは0秒より大きくしてください", true);
    return;
  }
  if (start >= sourceDuration) {
    setStatus("始点が動画の長さを超えています", true);
    return;
  }

  cutBtn.disabled = true;
  resultEl.classList.remove("active");
  logPre.textContent = "";
  progressBar.style.width = "0%";
  progressPct.textContent = "0%";
  setStatus("");

  try {
    await ensureFFmpeg();
    progressWrap.classList.add("active");
    progressLabel.textContent = "切り抜き中…";

    const data = await fetchFile(sourceFile);
    await ffmpeg.writeFile("input.mp4", data);

    const args = ["-ss", String(start), "-t", String(dur), "-i", "input.mp4"];
    if (crop916Toggle.checked) {
      // center crop to 9:16, width rounded to an even number for libx264
      const cropW = Math.floor(Math.min(sourceWidth, (sourceHeight * 9) / 16) / 2) * 2;
      args.push("-vf", `crop=${cropW}:${sourceHeight}`);
    }
    args.push(
      "-c:v", "libx264", "-preset", "veryfast", "-crf", "23", "-pix_fmt", "yuv420p",
      "-c:a", "aac", "-b:a", "160k",
      "output.mp4"
    );
    await ffmpeg.exec(args);

    const outData = await ffmpeg.readFile("output.mp4");
    const blob = new Blob([outData.buffer], { type: "video/mp4" });
    const url = URL.createObjectURL(blob);
    resultVideo.src = url;
    downloadLink.href = url;
    resultEl.classList.add("active");
    progressLabel.textContent = "完了";
    progressBar.style.width = "100%";
    progressPct.textContent = "100%";
  } catch (err) {
    console.error(err);
    setStatus("処理に失敗しました: " + err.message, true);
  } finally {
    cutBtn.disabled = false;
  }
});
</script>
</body>
</html>
